name: Mirror village boundaries (GitHub + HuggingFace)

# 村界数据镜像：原作者 GitHub → 你自己的 GitHub release + HuggingFace 双份备份。
# 🔴 铁律：6.5GB 文件本体绝不经过 tianditu 服务器；本 workflow 跑在 GitHub 云端。
#
# 三种触发：
#   1. repository_dispatch —— 服务端 tianditu 巡检发现新版后自动触发（主路径，带 version）
#   2. schedule           —— 每周兜底巡检一次（防止服务端漏报）
#   3. workflow_dispatch  —— 手动点 Run workflow
# 断点续传：downloads 目录用 actions/cache 持久化，.part 文件跨次保留。

on:
  repository_dispatch:
    types: [mirror-boundaries]
  schedule:
    - cron: '0 3 * * 1'       # 每周一 03:00 UTC 兜底
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本 tag（留空=自动取 latest）'
        required: false
        default: ''

permissions:
  contents: write               # 创建/更新自有仓库 release 资产

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          # 服务端触发时 version 在 client_payload；手动触发在 inputs；都没有就取 latest
          V="${{ github.event.client_payload.version }}"
          if [ -z "$V" ]; then V="${{ github.event.inputs.version }}"; fi
          if [ -z "$V" ]; then
            V=$(curl -s https://api.github.com/repos/thedavidweng/china-village-boundaries/releases/latest | grep -m1 '"tag_name"' | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "镜像版本：$V"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 缓存下载目录：脚本的 .part 断点文件跨运行保留，下次不从头下 6.5GB。
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: downloads
          key: village-boundaries-downloads-v1
          restore-keys: village-boundaries-downloads-

      - name: Install deps
        run: pip install -r tools/requirements.txt

      - name: Download release assets (resumable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/hf_mirror_sync.py --download-only --tag "${{ steps.ver.outputs.version }}" --cache-dir ./downloads

      # 备份一：推到你自己 GitHub 仓库的 release（同名 tag，资产齐全）
      - name: Mirror to own GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: downloads/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 备份二：推到 HuggingFace dataset
      - name: Mirror to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/hf_mirror_sync.py --folder ./downloads

      - name: Summary
        if: always()
        run: |
          echo "镜像版本 ${{ steps.ver.outputs.version }} 完成"
          echo "GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.version }}"
          echo "HF:     https://huggingface.co/datasets/laoco/china-village-boundaries"
